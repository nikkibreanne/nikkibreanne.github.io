# kennyBot command reference — rendered on /commands/ via _includes/commands.html
# and linked from chat by !kennycommands. Keep in sync with the bot's command
# registry (kennyBot/src/commands/registry.js). `sub: true` = subscriber-only;
# a group with `mod: true` = moderator commands. desc may contain simple HTML
# (use single-quoted attributes so the YAML stays double-quoted).
- group: "Clips"
  blurb: "Catch a moment as it happens. Anyone can use this."
  commands:
    - cmd: "!clip"
      desc: "Save the last ~60 seconds of stream. Type it just <em>after</em> the moment rather than during, and kennyBot confirms in chat once it has it — when Twitch clipping is switched on it posts the link too. One clip per person per minute."

- group: "Around the stream"
  blurb: "Odds and ends kennyBot keeps track of during a stream."
  commands:
    - cmd: "!timer"
      aliases: "!countdown"
      desc: "How long is left on the stream timer &mdash; the countdown a mod sets for a break, an intermission, or &ldquo;starting in 5&rdquo;. Anyone can ask; kennyBot also calls out the last few minutes and announces when it&rsquo;s up. Setting it is a mod control."
    - cmd: "!fact"
      args: "[#]"
      aliases: "!facts"
      desc: "A random Nikki fun fact. <code>!fact &lt;#&gt;</code> pulls up the one with that number on the <a href='/info/'>fun facts page</a>, and <code>!fact suggest &lt;text&gt;</code> proposes a new one for approval."
    - cmd: "!kennycommands"
      aliases: "!kennybot, !kcommands"
      desc: "This list."

- group: "Credits & the OKRAMARKET"
  blurb: "Fun-money you earn by hanging out, then wager on predictions. No pay-to-win — credits can't be bought, only earned."
  commands:
    - cmd: "!credits"
      aliases: "!points, !bal, !balance"
      desc: "Check your credit balance."
    - cmd: "!daily"
      desc: "Claim your daily credit allowance (your first-ever claim also drops a starter grubstake)."
    - cmd: "!bet"
      args: "<market#> <yes|no> <amount>"
      aliases: "!wager"
      desc: "Wager credits YES or NO on a market (the number targets it — see <code>!market</code>). You back one side; betting again on it adds to your stake. Winners split the whole pool proportional to their stake (parimutuel — no rake). If only one market is open you can skip the number: <code>!bet yes 100</code>."
    - cmd: "!market"
      desc: "List the open markets — several can run at once — with the YES/NO credit pool on each. Every market also takes a <strong>free</strong> community vote on the site (no credits)."
    - cmd: "!market suggest"
      args: "<question>"
      desc: "Propose a YES/NO market — e.g. <code>!market suggest Will we clear the boss tonight?</code>. A mod reviews it before it goes live."
    - cmd: "!duel"
      args: "<@user> <amount>"
      desc: "Challenge another viewer to a coin-flip duel for credits. They reply <code>!duel accept</code> or <code>!duel deny</code>; on accept both stake the wager and the winner takes the whole pot. Expires in 3 minutes."

- group: "Raid game · your raider"
  blurb: "The channel’s chat RPG. Grow a little hero while you hang out, and gear it up."
  commands:
    - cmd: "!create"
      args: "<class>"
      sub: true
      desc: "Create your raider. Pick one class: <strong>Guardian</strong> (tank), <strong>Mender</strong> (healer), <strong>Berserker</strong>, <strong>Arcanist</strong>, or <strong>Ranger</strong> (all damage). Comes with starter gear."
    - cmd: "!char"
      aliases: "!me"
      desc: "View your character — class, level, EXP, rating, combat stats, and what you have equipped."
    - cmd: "!bag"
      aliases: "!inventory, !inv"
      desc: "See your unequipped loot — everything grabbed but not yet worn. Anything your role cannot use is marked ⛔ — pass it on with <code>!give</code>."
    - cmd: "!equip"
      args: "<item|#>"
      desc: "Wear an item from your bag — by its <code>!bag</code> number or name. It slots into weapon, armor, or trinket automatically. Gear belongs to ONE role: equipping another role's item is refused (it would add nothing) and kennyBot names the class it is for."
    - cmd: "!unequip"
      args: "<slot|item>"
      desc: "Move a slot (weapon / armor / trinket) or named item back into your bag."
    - cmd: "!offer"
      args: "@user <item|#> [+ credits]"
      aliases: "!give, !gift"
      desc: "GIVE an item and/or credits to another player — one-way, nothing owed back. Put up an item by its <code>!bag</code> number or name (and optionally credits after a <code>+</code>) — e.g. <code>!offer @okrafan 2</code> or <code>!offer @okrafan 2 + 50</code>. They reply <code>!offer accept</code> or <code>!offer decline</code>. Perfect for handing a drop to the raider it suits."
    - cmd: "!trade"
      args: "@user <item|#> [+ credits]"
      desc: "Propose a real SWAP. You put up an item (by <code>!bag</code> number or name) and/or credits; the other player must put something up in return with <code>!trade counter &lt;their item # or credits&gt;</code> before it can go through — a bare <code>!trade accept</code> with nothing on their side is refused. Countering flips it back to you to <code>!trade accept</code>, counter again, or <code>!trade decline</code>. Each side only stakes from its own bag, offers expire after 5 minutes, and the swap is all-or-nothing. (Just want to give something away? Use <code>!offer</code>.)"

- group: "Raid game · loot & raids"
  blurb: "Chat loot drops, the weekly boss, and the leaderboard."
  commands:
    - cmd: "!grab"
      aliases: "!loot"
      sub: true
      desc: "Enter the drawing for the active loot drop. One winner is drawn when the window closes and gets the item. 🎲"
    - cmd: "!muster"
      sub_note: "subs to enlist"
      desc: "Enlist your hero for the SEASON (subscribers) — once, not weekly. You stay on the roster for every week until the season ends; a new season starts everyone fresh. Any time, it reports the current raid status and links you to the action."
    - cmd: "!salvage"
      args: "<item|#> [confirm]"
      aliases: "!melt"
      desc: "Melt an item into credits, priced by rarity. <code>!salvage offrole</code> clears everything your role cannot wear in one pass. Epic and better need an explicit <code>confirm</code>. It pays less than the piece is worth to a hero who CAN use it — giving it away with <code>!give</code> is always the better deal."
    - cmd: "!respec"
      args: "<class>"
      sub: true
      aliases: "!reclass"
      desc: "Change class, and with it your battlefield role, for credits. Level, EXP and renown are kept; equipped gear returns to your bag (to trade or salvage) and a fresh starter set for the new role is equipped."
    - cmd: "!top"
      args: "[damage]"
      desc: "The season leaderboard — ONE BOARD PER ROLE, each measured on its own job: <code>!top dps</code> ranks boss damage, <code>!top healer</code> ranks healing done, <code>!top tank</code> ranks damage soaked. A bare <code>!top</code> shows the damage board."

- group: "Mod tools"
  mod: true
  blurb: "For moderators running the show. Nobody else needs these."
  commands:
    - cmd: "!market"
      args: "open <question> | close <#> | resolve <#> <yes|no> | cancel <#>"
      desc: "Run the OKRAMARKET — open a YES/NO market for wagering, close betting on one, resolve it to a winner (parimutuel payout), or cancel and refund every bet. Several can run at once (target each by its number)."
    - cmd: "!market"
      args: "queue | approve <#> | reject <#>"
      desc: "Review viewer market suggestions and promote one to a live market."
    - cmd: "!exp"
      args: "on | off | auto | status"
      desc: "EXP gate control. <code>auto</code> follows the channel's live status."
    - cmd: "!mute"
      args: "on | off | status"
      aliases: "!silence"
      desc: "Silence kennyBot's chat output — it keeps listening and tracking in the background."
    - cmd: "!clipmode"
      args: "horizontal | vertical | twitch | local | all | off | status"
      desc: "Choose which copies <code>!clip</code> makes — the widescreen recording, the portrait one, a public Twitch clip, or any combination (<code>!clipmode horizontal twitch</code>). <code>local</code> is both local copies, <code>all</code> is everything, <code>off</code> disables <code>!clip</code>. <code>status</code> reports the current mode <em>and</em> whether each part is actually working. Takes effect immediately and survives a restart."
    - cmd: "!start"
      aliases: "!slate"
      desc: "Drop a sync point at the top of the stream so this session's clips can be lined up with the recording afterwards. Run it once as you go live."
    - cmd: "!drop"
      args: "[itemId]"
      desc: "Force a loot drop right now."
    - cmd: "!drops"
      args: "on | off | every <min> | status"
      desc: "Control the automatic chat-drop scheduler."
    - cmd: "!boss"
      args: "set <name> | next"
      desc: "Set a custom boss, or advance to the next scripted season boss."
    - cmd: "!raidnight"
      desc: "Lock the roster and run the battle now."
    - cmd: "!fact"
      args: "pending | approve <#> | reject <#>"
      desc: "Review the viewer fact suggestions from <code>!fact suggest</code> — approving one publishes it straight to the <a href='/info/'>fun facts page</a>."
    - cmd: "!reminder"
      args: "on|off|test <id> | at <id> <times> | every|after <id> <min>"
      aliases: "!reminders"
      desc: "The recurring nudges kennyBot posts on stream &mdash; the Wallpaper Engine check 30 minutes in, Ghosty&rsquo;s meal times with a heads-up beforehand, and an hourly hydration ping. A bare <code>!reminder</code> lists them all with what fires when. Every schedule is stored in the database, so re-timing one from chat (<code>!reminder at ghosty 09:00 18:00</code>) sticks &mdash; and survives updates to the bot. Also takes <code>lead</code>, <code>jitter</code>, <code>text</code>, <code>leadtext</code>, <code>zone</code> and <code>channel</code>. They only fire while the stream is live; a slot missed while offline is skipped rather than announced late."
    - cmd: "!timer"
      args: "<duration> [label] | +5 | -2m | pause | resume | stop"
      desc: "Set the stream countdown &mdash; e.g. <code>!timer 10 Coffee break</code>. A bare number is minutes; <code>90s</code>, <code>45m</code>, <code>1h30m</code> and <code>5:30</code> all work too, and the words after it become the label. <code>!timer +5</code> / <code>!timer -2m</code> add or remove time without restarting it, and <code>pause</code> / <code>resume</code> / <code>stop</code> do what they say. kennyBot posts a heads-up at 5 minutes and 1 minute, then calls time. Only one timer runs at a time (setting another replaces it), and it survives a bot restart. Anyone can check it with a bare <code>!timer</code>."
    - cmd: "!todo"
      args: "add [date] <text> | remove <#> | list"
      aliases: "!todos"
      desc: "Manage Nikki's <a href='/todo/'>to-do board</a> &mdash; add a dated item (date optional, defaults to today; e.g. <code>!todo add 2026-07-20 order a new mic</code>), cross one off by its number, or list the board. Chat-controlled; the page is read-only."
    - cmd: "!season"
      args: "next | start <id> [name] | rollover <id> [name]"
      desc: "<code>!season next</code> is the one to use — it works out the tier and the season name itself, so there is nothing to remember or mistype. From a cold start it opens tier 1; otherwise it rolls over: gear resets for everyone, levels and renown are kept, and veterans of the outgoing season are paid prestige renown for each raid they attended. It refuses while a raid is locked or live, and refuses once the last scripted tier has been played. <code>start</code> and <code>rollover</code> take an explicit id and name for off-script seasons."
